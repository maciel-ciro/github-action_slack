name: Smoke
on:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Published image posts the Slack payload
        run: |
          python3 - << 'PY' &
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class H(BaseHTTPRequestHandler):
              def do_POST(self):
                  n = int(self.headers.get("Content-Length", 0))
                  open("/tmp/slack-payload.json", "wb").write(self.rfile.read(n))
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b"ok")
              def log_message(self, fmt, *args):
                  pass
          HTTPServer(("127.0.0.1", 8765), H).handle_request()
          PY
          echo '{}' > /tmp/event.json
          sleep 0.5
          docker run --rm --network host \
            -e SLACK_WEBHOOK=http://127.0.0.1:8765/ \
            -e SLACK_CHANNEL=deploys \
            -e SLACK_COLOR=success \
            -e SLACK_MESSAGE='smoke from published image' \
            -e SLACK_TITLE='Status message' \
            -e SLACK_USERNAME=ciro-maciel \
            -e GITHUB_SHA=c92a490c92a490c92a490c92a490c92a490c92a4 \
            -e GITHUB_REF=refs/heads/master \
            -e GITHUB_EVENT_NAME=workflow_dispatch \
            -e GITHUB_REPOSITORY=maciel-ciro/github-action_slack \
            -e GITHUB_WORKFLOW=Smoke \
            -e GITHUB_SERVER_URL=https://github.com \
            -e GITHUB_ACTOR=maciel-ciro \
            -e GITHUB_RUN=https://github.com/maciel-ciro/github-action_slack \
            -e GITHUB_WORKSPACE=/tmp \
            -e GITHUB_EVENT_PATH=/tmp/event.json \
            -v /tmp/event.json:/tmp/event.json \
            ghcr.io/maciel-ciro/github-action_slack:v1.2.0
          python3 - << 'PY'
          import json
          payload = json.load(open("/tmp/slack-payload.json"))
          attachment = payload["attachments"][0]
          titles = {field["title"]: field["value"] for field in attachment["fields"]}
          assert payload["username"] == "ciro-maciel"
          assert payload["channel"] == "deploys"
          assert attachment["color"] == "good"
          assert "maciel-ciro" in attachment["footer"]
          assert titles["Status message"] == "smoke from published image"
          print("smoke ok")
          PY
